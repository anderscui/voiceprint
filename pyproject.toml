[project]
name = "voiceprint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andersc", email = "anderscui@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlx-audio>=0.5.4",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
voiceprint = "voiceprint.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
